<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<style>

  --primary: #d4af37;
  --primary-light: #f0d488;
  --primary-soft: rgba(212,175,55,.12);
  --accent: #d4af37;
  --accent-light: #f0d488;
  --accent-soft: #241a08;
  --water: #6fb1dc;
  --water-soft: #0e1e2a;
  --bg: #050505;
  --card: #121212;
  --t1: #f5f0e6;
  --t2: #b3aa99;
  --t3: #7a7264;
  --divider: #1c1a16;
  --border: #2a2620;
  --err: #e05252;
  --err-soft: #2a1212;
  --ok: #6abe7c;
  --shadow: 0 1px 6px rgba(0,0,0,.55);
  --glow-primary: 0 0 12px rgba(212,175,55,.22);
  --glow-accent: 0 0 12px rgba(212,175,55,.3);
  --glow-water: 0 0 12px rgba(111,177,220,.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: var(--bg);
  color: var(--t1);
  font-size: 14px;
  line-height: 1.5;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 76px; }
.view { padding: 0 16px 16px; }

/* 顶部渐变头 */
.header {
  margin: 0 -16px 12px;
  padding: 20px 16px;
  background: linear-gradient(135deg, rgba(212,175,55,.16) 0%, rgba(212,175,55,.04) 100%);
  border-bottom: 1px solid rgba(212,175,55,.3);
  border-radius: 0 0 20px 20px;
  color: var(--t1);
}
.header-top { display: flex; justify-content: space-between; align-items: flex-start; }
.greeting { font-size: 20px; font-weight: 700; color: #fff; }
.date { font-size: 12px; color: var(--t2); margin-top: 4px; }
.goal-chip { background: rgba(212,175,55,.12); border: 1px solid rgba(212,175,55,.35); border-radius: 999px; padding: 4px 12px; font-size: 11px; white-space: nowrap; color: #fff; }
.header-stats { display: flex; margin-top: 16px; background: rgba(212,175,55,.08); border-radius: 12px; padding: 12px 8px; }
.stat-item { flex: 1; text-align: center; }
.stat-item b { display: block; font-size: 18px; color: #fff; }
.stat-item span { font-size: 11px; color: var(--t3); }
.stat-divider { width: 1px; background: var(--divider); }

/* 卡片 */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: center; }
.card-title { display: flex; align-items: center; font-size: 16px; font-weight: 600; }
.bar { width: 4px; height: 16px; border-radius: 2px; background: var(--primary); margin-right: 8px; box-shadow: var(--glow-primary); }
.bar.blue { background: var(--water); box-shadow: var(--glow-water); }
.bar.orange { background: var(--accent); box-shadow: var(--glow-accent); }
.card-extra { font-size: 12px; color: var(--t3); }
.card-body { margin-top: 12px; }

/* 标签 */
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; margin-right: 6px; }
.tag.green { background: var(--primary-soft); color: var(--t1); }
.tag.orange { background: var(--accent-soft); color: var(--accent); }
.tag.blue { background: var(--water-soft); color: var(--water); }
.tag.gray { background: var(--divider); color: var(--t3); }
.tag.red { background: var(--err-soft); color: var(--err); }

/* 按钮 */
.btn {
  display: flex; align-items: center; justify-content: center;
  height: 40px; border-radius: 999px; border: none;
  font-size: 14px; font-weight: 600; color: #fff;
  transition: all .2s; cursor: pointer; white-space: nowrap;
}
.btn:active { opacity: .9; transform: scale(.98); }
.btn.accent { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #1a1408; margin-top: 12px; width: 100%; box-shadow: var(--glow-accent); }
.btn.done { background: var(--divider); color: var(--t3); box-shadow: none; }
.btn.water { background: var(--water); color: #06202e; flex: 1; height: 32px; font-size: 13px; font-weight: 500; box-shadow: var(--glow-water); }
.btn.water-soft { background: var(--water-soft); border: 1px solid rgba(111,177,220,.35); color: var(--water); flex: 1; height: 32px; font-size: 13px; font-weight: 500; }
.btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #1a1408; width: 100px; height: 32px; font-size: 13px; flex-shrink: 0; box-shadow: var(--glow-primary); }

/* 进度条 */
.track { width: 100%; height: 8px; background: var(--divider); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; border-radius: 999px; background: var(--water); transition: width .3s; box-shadow: var(--glow-water); }

/* 行 */
.row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--divider); }
.row:last-child { border-bottom: none; }
.row .name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sets { font-size: 12px; color: var(--t3); margin-left: 8px; white-space: nowrap; }
.more { font-size: 11px; color: var(--t3); margin-top: 6px; }
.tip-text { font-size: 11px; color: var(--t3); line-height: 1.7; margin-top: 8px; }

.water-btns { display: flex; gap: 8px; margin-top: 12px; }

.meal-row { display: flex; align-items: flex-start; margin-top: 8px; }
.meal-row:first-child { margin-top: 0; }
.meal-label { min-width: 44px; padding: 2px 8px; background: var(--primary-soft); color: var(--t1); border-radius: 6px; font-size: 11px; text-align: center; white-space: nowrap; }
.meal-items { flex: 1; margin-left: 8px; font-size: 12px; color: var(--t2); line-height: 1.7; }

.tip-card { padding: 16px; background: linear-gradient(135deg, var(--accent-soft), var(--card)); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.tip-card b { color: var(--t1); font-size: 12px; }
.tip-card p { margin-top: 4px; font-size: 14px; color: var(--t2); line-height: 1.7; }

/* 页头 */
.page-head { padding: 16px 0 12px; }
.page-head h1 { font-size: 20px; font-weight: 700; color: #fff; }
.page-head p { font-size: 12px; color: var(--t3); margin-top: 4px; }

/* 训练日卡片 */
.day-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.day-card.today { border: 1px solid var(--primary); box-shadow: var(--glow-primary); }
.day-head { display: flex; align-items: center; cursor: pointer; }
.day-badge { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-soft); color: var(--t1); display: flex; align-items: center; justify-content: center; font-weight: 600; margin-right: 12px; flex-shrink: 0; }
.day-card.today .day-badge { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #1a1408; box-shadow: var(--glow-primary); }
.day-info { flex: 1; min-width: 0; }
.day-title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-meta { font-size: 11px; color: var(--t3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-right { display: flex; align-items: center; margin-left: 8px; flex-shrink: 0; }
.today-tag { padding: 2px 8px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; font-size: 11px; }
.ex-list { margin-top: 12px; border-top: 1px solid var(--divider); }
.ex-item { padding: 12px 0; border-bottom: 1px solid var(--divider); }
.ex-item:last-child { border-bottom: none; }
.ex-top { display: flex; justify-content: space-between; align-items: center; }
.ex-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-sets { font-size: 12px; font-weight: 600; color: var(--t1); margin-left: 8px; white-space: nowrap; }
.ex-tips { font-size: 12px; color: var(--t3); margin-top: 4px; }
.ex-bottom { display: flex; align-items: center; margin-top: 6px; }
.ex-rest { font-size: 11px; color: var(--t3); margin-right: 8px; }
.day-note { display: block; margin-top: 8px; padding: 8px 12px; background: var(--water-soft); border: 1px solid rgba(111,177,220,.25); border-radius: 6px; font-size: 11px; color: var(--water); line-height: 1.7; }
.footer-card { padding: 16px; background: linear-gradient(135deg, var(--primary-soft), var(--card)); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.footer-card b { color: var(--t1); font-size: 14px; }
.footer-card p { margin-top: 6px; font-size: 12px; color: var(--t2); line-height: 1.7; }

/* 饮食页 */
.day-scroll { display: flex; overflow-x: auto; margin: 12px -16px; padding: 0 16px; gap: 8px; scrollbar-width: none; }
.day-scroll::-webkit-scrollbar { display: none; }
.day-chip { flex-shrink: 0; width: 64px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow); font-size: 12px; color: var(--t2); cursor: pointer; transition: all .2s; }
.day-chip.active { background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-color: transparent; color: #1a1408; font-weight: 600; box-shadow: var(--glow-primary); }
.meal-block { margin-bottom: 16px; }
.meal-block:last-child { margin-bottom: 0; }
.meal-head { display: flex; justify-content: space-between; align-items: center; }
.meal-head .label { padding: 2px 12px; background: var(--primary-soft); color: var(--t1); border-radius: 6px; font-size: 12px; font-weight: 600; }
.meal-head .tip { font-size: 11px; color: var(--t3); margin-left: 8px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-wrap { display: flex; flex-wrap: wrap; margin-top: 8px; }
.item-wrap .tag { margin: 0 6px 6px 0; }
.hyd-row { display: flex; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--divider); }
.hyd-row:last-child { border-bottom: none; }
.hyd-time { width: 90px; font-size: 12px; flex-shrink: 0; }
.hyd-amount { flex: 1; font-size: 12px; font-weight: 600; color: var(--water); }
.hyd-note { font-size: 11px; color: var(--t3); }
.principle-row { display: flex; align-items: flex-start; margin-top: 8px; }
.principle-row:first-child { margin-top: 0; }
.principle-label { min-width: 64px; padding: 2px 8px; background: var(--divider); color: var(--t2); border-radius: 6px; font-size: 11px; text-align: center; white-space: nowrap; }
.principle-text { flex: 1; margin-left: 8px; font-size: 12px; color: var(--t2); line-height: 1.7; }

/* 我的页 */
.profile-card { margin: 12px 0; padding: 20px 16px; background: linear-gradient(135deg, rgba(212,175,55,.16), rgba(212,175,55,.04)); border: 1px solid rgba(212,175,55,.3); border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; color: var(--t1); }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: rgba(212,175,55,.15); border: 1px solid rgba(212,175,55,.4); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; margin-right: 16px; flex-shrink: 0; box-shadow: var(--glow-primary); }
.profile-info { flex: 1; min-width: 0; }
.profile-info b { font-size: 18px; color: #fff; }
.profile-info p { font-size: 12px; color: var(--t2); margin-top: 4px; }
.stats-grid { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 8px; margin-bottom: 12px; }
.stats-grid .stat-item b { color: #fff; }
.stats-grid .stat-item b.blue { color: var(--water); }
.stats-grid .stat-item b.orange { color: var(--accent); }
.stats-grid .stat-item span { color: var(--t3); }
.stats-grid .stat-divider { background: var(--divider); }
.weight-input-row { display: flex; gap: 8px; }
.weight-input-row input {
  flex: 1; height: 32px; border: 1px solid var(--border); background: var(--divider);
  border-radius: 10px; padding: 0 12px; font-size: 14px; outline: none; color: var(--t1);
}
.del-btn { border: none; background: var(--err-soft); color: var(--err); border-radius: 6px; font-size: 11px; padding: 2px 8px; margin-left: 8px; cursor: pointer; flex-shrink: 0; }
.empty { text-align: center; font-size: 12px; color: var(--t3); margin-top: 12px; }
.note-item { padding: 12px 0; border-bottom: 1px solid var(--divider); }
.note-item:last-child { border-bottom: none; padding-bottom: 0; }
.note-head { display: flex; align-items: center; justify-content: space-between; }
.note-head .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.note-text { font-size: 12px; color: var(--t3); line-height: 1.7; margin-top: 4px; }

/* 底部导航 */
#tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: #0a0a0a;
  display: flex; border-top: 1px solid var(--divider);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 0 4px; color: var(--t3); font-size: 10px; border: none; background: none; cursor: pointer; }
.tab svg { width: 22px; height: 22px; margin-bottom: 2px; }
.tab.active { color: #fff; }
</style>
</head>

    { meal: '午餐', items: ['酱鸭(去皮)', '炒麦穗腰花', '蒜蓉空心菜', '萝卜丝仔排汤'], tip: '鸭皮油脂高，去皮再吃' },
    { meal: '晚餐', items: ['水饺', '加一份蔬菜'], tip: '水饺约15个为宜' } ] },
  { day: 4, label: '周四', source: 'company', meals: [
    { meal: '早餐', items: ['煮鸡蛋', '白米粥+豆浆', '蒸南瓜+红薯', '烧麦1个'], tip: '南瓜红薯是优质粗粮' },
    { meal: '午餐', items: ['盐水大虾', '青芥木耳炒鸡蛋', '清炒小白菜', '清炖鸡块冬瓜贝丝瓜'], tip: '今日菜单最友好，虾是顶级蛋白' },
    { meal: '晚餐', items: ['四菜一汤(挑蔬菜+蛋白)', '米饭减半'], tip: '苹果可作加餐' } ] },
  { day: 5, label: '周五', source: 'company', meals: [
    { meal: '早餐', items: ['煮鸡蛋', '玉米粥', '蒸山芋+胡萝卜', '肉包半个'], tip: '肉包浅尝半个即可' },
    { meal: '午餐', items: ['青椒肉丝', '剁椒蒸豆腐', '蒜蓉韭菜', '丝瓜炒鸡蛋'], tip: '卤鸡翅/猪蹄今天跳过' },
    { meal: '晚餐', items: ['四菜一汤(挑蔬菜+蛋白)', '米饭减半'], tip: '果汁换成白水' } ] },
  { day: 6, label: '周六', source: 'weekend', meals: [
    { meal: '早餐', items: ['煮鸡蛋2个', '牛奶', '全麦面包1片', '番茄'], tip: '周末自制，蛋白拉满' },
    { meal: '午餐', items: ['煎鸡胸/牛肉', '杂蔬沙拉(少酱)', '糙米饭小碗'], tip: '少油煎制，沙拉酱减半' },
    { meal: '晚餐', items: ['清蒸鱼', '蒜蓉蔬菜', '主食少量'], tip: '晚餐七分饱' } ] },
  { day: 7, label: '周日', source: 'weekend', meals: [
    { meal: '早餐', items: ['无糖酸奶', '燕麦+坚果少量', '煮鸡蛋', '蓝莓/苹果'], tip: '慢碳+蛋白开启休息日' },
    { meal: '午餐', items: ['虾仁炒蛋', '白灼蔬菜', '玉米1根'], tip: '清淡为主，为下周蓄力' },
    { meal: '晚餐', items: ['豆腐蔬菜汤', '全麦馒头半个'], tip: '轻断食感晚餐，不饿即可' } ] }
];

const avoidList = ['红油拌面', '油条', '卤猪蹄(大量)', '果汁/含糖饮料', '浓茶/浓咖啡', '大量腌菜(高钠)'];
const hydrationProtocol = [
  { time: '起床后', amount: '500ml', note: '稀释尿液，启动代谢' },
  { time: '上午工作', amount: '约600ml', note: '每小时约200ml' },
  { time: '训练前30分钟', amount: '300-500ml', note: '提前储备' },
  { time: '训练中', amount: '150-200ml/15-20分钟', note: '小口多次' },
  { time: '训练后', amount: '500-700ml', note: '补足流失' },
  { time: '下午+晚间', amount: '约600ml', note: '晚间少量，避免起夜' }
];
const dietPrinciples = [
  { label: '热量目标', text: '每日约1800-2000kcal，制造温和缺口' },
  { label: '蛋白质', text: '每日≥120g，每餐一掌心（蛋/虾/鸡/豆腐）' },
  { label: '碳水', text: '优先粗粮（玉米/红薯/山药/南瓜），米饭2/3' },
  { label: '烹饪', text: '优先蒸/煮/炖/清炒，避开酥脆/卤/红油' },
  { label: '进食顺序', text: '先蔬菜 → 再蛋白 → 最后主食' }
];
const healthTips = [
  '补水是今日第一任务：目标2500ml，别等渴了才喝。',
  '力量日训练后1小时内补充蛋白质（鸡蛋/牛奶/鸡肉）。',
  '午餐先吃蔬菜再吃肉，米饭只打2/3。',
  '每坐1小时起身活动5分钟，做一组弹力带扩胸。',
  '乒乓球日：踝膝充分热身，间歇小口补水。',
  '腿日训练前后各补水500ml，练后加2组开合跳辅助排石。',
  '休息日：饭后散步+全身拉伸，饮水目标不变。'
];
const healthNotes = [
  { title: '左肾结石4×3mm + 双肾结晶', level: 'warning', text: '每日饮水≥2500ml，训练后及时补足；减少浓茶、咖啡与高草酸食物；泌尿外科定期复查，若腰痛或血尿及时就诊。' },
  { title: '超重 体质指数24.2', level: 'warning', text: '较9个月前25.2已下降，控制有效。继续力量+有氧，目标体质指数<23.9（约69kg），每周降0.3-0.5kg。' },
  { title: '窦性心动过缓（心率54）', level: 'ok', text: '规律锻炼者常见表现，无症状通常无病理意义。保持规律作息，心内科随诊即可。' },
  { title: '裸眼视力偏低 / 鼻窦炎', level: 'ok', text: '球类与跑步时戴好眼镜注意安全；鼻窦炎如鼻塞头痛持续，耳鼻喉科评估。' }
];

/* ============ 状态（本地增删改查） ============ */
let state = load();
function load() {
  try {
    const v = JSON.parse(localStorage.getItem('fit_web_data'));
    if (v && v.water && v.workout && v.weights) return v;
  } catch (e) { console.error('[存储] 读取失败', e); }
  return { water: {}, workout: {}, weights: [] };
}
function save() {
  try { localStorage.setItem('fit_web_data', JSON.stringify(state)); }
  catch (e) { console.error('[存储] 写入失败', e); }
}

let tab = 'today';
let trainExpanded = weekday();
let dietSelected = weekday();

/* ============ 操作 ============ */
function switchTab(t) { tab = t; render(); }
function toggleWorkout() {
  const k = todayKey();
  state.workout[k] = !state.workout[k];
  save(); render();
}
function addWater(ml) {
  const k = todayKey();
  state.water[k] = (state.water[k] || 0) + ml;
  save(); render();
}
function setTrainDay(d) { trainExpanded = trainExpanded === d ? 0 : d; render(); }
function setDietDay(d) { dietSelected = d; render(); }
function recordWeight() {
  const input = document.getElementById('weightInput');
  const value = parseFloat(input.value);
  if (isNaN(value) || value < 40 || value > 150) { alert('请输入有效体重（40-150公斤）'); return; }
  const k = todayKey();
  const rest = state.weights.filter((w) => w.date !== k);
  state.weights = [{ date: k, weight: Math.round(value * 10) / 10 }, ...rest].sort((a, b) => a.date < b.date ? 1 : -1);
  save(); render();
}
function delWeight(date) {
  if (!confirm('删除 ' + date + ' 的体重记录？')) return;
  state.weights = state.weights.filter((w) => w.date !== date);
  save(); render();
}

/* ============ 计算 ============ */
function latestWeight() { return state.weights.length > 0 ? state.weights[0].weight : profile.baseWeight; }
function bmi() { return (latestWeight() / Math.pow(profile.height / 100, 2)).toFixed(1); }
function streak() {
  let s = 0;
  const d = new Date();
  const key = (dt) => dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
  if (!state.workout[key(d)]) d.setDate(d.getDate() - 1);
  while (state.workout[key(d)]) { s++; d.setDate(d.getDate() - 1); }
  return s;
}
function totalWorkouts() { return Object.values(state.workout).filter(Boolean).length; }
function totalWaterL() { return (Object.values(state.water).reduce((a, b) => a + b, 0) / 1000).toFixed(1); }

/* ============ 视图 ============ */
function card(title, extra, theme, body) {
  return '<div class="card"><div class="card-head"><div class="card-title"><span class="bar ' + (theme || '') + '"></span>' + title + '</div>' + (extra ? '<span class="card-extra">' + extra + '</span>' : '') + '</div><div class="card-body">' + body + '</div></div>';
}

function viewToday() {
  const wd = weekday();
  const plan = weeklyPlan[wd - 1];
  const diet = dietDays[wd - 1];
  const water = state.water[todayKey()] || 0;
  const checked = !!state.workout[todayKey()];
  const preview = plan.exercises.slice(0, 3).map((ex) =>
    '<div class="row"><span class="name">' + ex.name + '</span><span class="sets">' + ex.sets + '</span></div>').join('');
  return '' +
  '<div class="header"><div class="header-top"><div><div class="greeting">你好，Song哥</div><div class="date">' + fmtDate() + ' · 周' + CN[wd - 1] + ' · 私人教练已就位</div></div><span class="goal-chip">目标 ' + profile.goalWeight + 'kg</span></div>' +
  '<div class="header-stats"><div class="stat-item"><b>' + bmi() + '</b><span>体质指数</span></div><div class="stat-divider"></div><div class="stat-item"><b>' + latestWeight().toFixed(1) + '</b><span>体重kg</span></div><div class="stat-divider"></div><div class="stat-item"><b>' + profile.heartRate + '</b><span>静息心率</span></div></div></div>' +
  card('今日训练', plan.duration, '',
    '<div><span class="tag ' + (plan.type === 'rest' ? 'gray' : 'green') + '">' + typeLabel[plan.type] + '</span><b style="font-size:15px">' + plan.title + '</b></div>' +
    '<div class="tip-text" style="margin-top:4px">' + plan.focus + '</div>' +
    (plan.exercises.length ? '<div style="margin-top:12px">' + preview + (plan.exercises.length > 3 ? '<div class="more">还有 ' + (plan.exercises.length - 3) + ' 个动作，详见「训练」页</div>' : '') + '</div>' : '') +
    '<button class="btn accent ' + (checked ? 'done' : '') + '" onclick="toggleWorkout()">' + (checked ? '已打卡 · 继续保持' : (plan.type === 'rest' ? '完成休息打卡' : '完成训练打卡')) + '</button>') +
  card('饮水打卡', water + '/' + WATER_GOAL + 'ml', 'blue',
    '<div class="track"><div class="fill" style="width:' + Math.min(100, Math.round(water / WATER_GOAL * 100)) + '%"></div></div>' +
    '<div class="water-btns"><button class="btn water" onclick="addWater(250)">+250ml</button><button class="btn water-soft" onclick="addWater(500)">+500ml</button></div>' +
    '<div class="tip-text">左肾结石4×3mm+双肾结晶：小口多次、别等渴了才喝，训练后加补500ml。</div>') +
  card('今日饮食建议', diet.source === 'company' ? '公司食堂' : '周末', '',
    diet.meals.map((m) => '<div class="meal-row"><span class="meal-label">' + m.meal + '</span><span class="meal-items">' + m.items.join(' + ') + '</span></div>').join('')) +
  '<div class="tip-card"><b>教练提示</b><p>' + healthTips[wd - 1] + '</p></div>';
}

function viewTraining() {
  const today = weekday();
  const days = weeklyPlan.map((p) => {
    const active = trainExpanded === p.day;
    let body = '';
    if (active && p.exercises.length) {
      body = '<div class="ex-list">' + p.exercises.map((ex) =>
        '<div class="ex-item"><div class="ex-top"><span class="ex-name">' + ex.name + '</span><span class="ex-sets">' + ex.sets + '</span></div>' +
        '<div class="ex-tips">' + ex.tips + '</div>' +
        '<div class="ex-bottom"><span class="ex-rest">' + ex.rest + '</span>' + (ex.tags || []).map((t) => '<span class="tag orange">' + t + '</span>').join('') + '</div></div>').join('') + '</div>';
    }
    if (active && p.note) body += '<span class="day-note">' + p.note + '</span>';
    return '<div class="day-card ' + (p.day === today ? 'today' : '') + '"><div class="day-head" onclick="setTrainDay(' + p.day + ')">' +
      '<div class="day-badge">' + CN[p.day - 1] + '</div>' +
      '<div class="day-info"><div class="day-title">' + p.title + '</div><div class="day-meta">' + p.duration + ' · ' + p.focus + '</div></div>' +
      '<div class="day-right"><span class="tag ' + typeColor[p.type] + '">' + typeLabel[p.type] + '</span>' + (p.day === today ? '<span class="today-tag">今日</span>' : '') + '</div></div>' + body + '</div>';
  }).join('');
  return '<div class="page-head"><h1>每周训练计划</h1><p>推/拉/腿分化 + 有氧与乒乓球 · 每次40-60分钟</p></div>' + days +
    '<div class="footer-card"><b>渐进与补水原则</b><p>每2周小幅增加重量或次数；每天晨起如厕后称重，跟踪周均值，目标每周降0.3-0.5kg。</p><p>补水铁律：训练前300-500ml，训练中每15-20分钟150-200ml，训练后500-700ml。</p></div>';
}

function viewDiet() {
  const diet = dietDays[dietSelected - 1];
  const chips = dietDays.map((d) => '<div class="day-chip ' + (dietSelected === d.day ? 'active' : '') + '" onclick="setDietDay(' + d.day + ')">' + d.label + '</div>').join('');
  const meals = diet.meals.map((m) =>
    '<div class="meal-block"><div class="meal-head"><span class="label">' + m.meal + '</span>' + (m.tip ? '<span class="tip">' + m.tip + '</span>' : '') + '</div>' +
    '<div class="item-wrap">' + m.items.map((it) => '<span class="tag green">' + it + '</span>').join('') + '</div></div>').join('');
  return '<div class="day-scroll">' + chips + '</div>' +
    card(diet.source === 'company' ? '公司食堂选菜' : '周末饮食建议', diet.label + ' · ' + (diet.source === 'company' ? '公司食堂' : '自制'), '', meals) +
    card('补水协议', '目标2500ml+/天', 'blue', hydrationProtocol.map((h) =>
      '<div class="hyd-row"><span class="hyd-time">' + h.time + '</span><span class="hyd-amount">' + h.amount + '</span><span class="hyd-note">' + h.note + '</span></div>').join('')) +
    card('少吃或避免', '', 'orange', '<div class="item-wrap">' + avoidList.map((a) => '<span class="tag red">' + a + '</span>').join('') + '</div><div class="tip-text">肾结石+肾结晶特护：避免浓茶、浓咖啡与含糖饮料，腌菜高钠控量。</div>') +
    card('饮食总原则', '', '', dietPrinciples.map((p) => '<div class="principle-row"><span class="principle-label">' + p.label + '</span><span class="principle-text">' + p.text + '</span></div>').join(''));
}

function viewMine() {
  const rows = state.weights.slice(0, 7).map((w, i) => {
    const prev = state.weights[i + 1];
    let delta = '';
    if (prev) {
      const d = w.weight - prev.weight;
      delta = '<span style="font-size:11px;color:' + (d <= 0 ? 'var(--ok)' : 'var(--err)') + ';margin-left:8px">' + (d <= 0 ? '' : '+') + d.toFixed(1) + '</span>';
    }
    return '<div class="row"><span style="font-size:12px;color:var(--t3)">' + w.date + '</span><span style="display:flex;align-items:center"><b>' + w.weight.toFixed(1) + 'kg</b>' + delta + '<button class="del-btn" onclick="delWeight(\'' + w.date + '\')">删除</button></span></div>';
  }).join('');
  return '<div class="profile-card"><div class="avatar">松</div><div class="profile-info"><b>' + profile.name + '</b><p>' + profile.age + '岁 · ' + profile.height + 'cm · 规律锻炼</p></div><span class="goal-chip">目标 ' + profile.goalWeight + 'kg</span></div>' +
  '<div class="stats-grid"><div class="stat-item"><b>' + latestWeight().toFixed(1) + '</b><span>最新体重kg</span></div><div class="stat-divider"></div><div class="stat-item"><b class="orange">' + bmi() + '</b><span>体质指数</span></div><div class="stat-divider"></div><div class="stat-item"><b>' + streak() + '</b><span>连续打卡天</span></div></div>' +
  '<div class="stats-grid"><div class="stat-item"><b>' + totalWorkouts() + '</b><span>累计打卡次</span></div><div class="stat-divider"></div><div class="stat-item"><b class="blue">' + totalWaterL() + '</b><span>累计饮水L</span></div><div class="stat-divider"></div><div class="stat-item"><b>' + (latestWeight() - profile.goalWeight).toFixed(1) + '</b><span>距目标kg</span></div></div>' +
  card('体重记录', '晨起如厕后称重 · 同日重记为修改', '',
    '<div class="weight-input-row"><input id="weightInput" type="number" step="0.1" placeholder="输入今日体重，如 70.5"><button class="btn primary" onclick="recordWeight()">记录</button></div>' +
    (state.weights.length ? '<div style="margin-top:12px;border-top:1px solid var(--divider)">' + rows + '</div>' : '<div class="empty">暂无记录，先记下今天的体重吧</div>')) +
  card('体检健康注意事项', '报告 ' + profile.reportDate, '', healthNotes.map((n) =>
    '<div class="note-item"><div class="note-head"><span class="t">' + n.title + '</span><span class="tag ' + (n.level === 'warning' ? 'orange' : 'gray') + '">' + (n.level === 'warning' ? '重点关注' : '保持观察') + '</span></div><div class="note-text">' + n.text + '</div></div>').join(''));
}

/* ============ 导航 ============ */
const icons = {
  today: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h4.5v-5.5h4V21h4.5V9.5"/>',
  training: '<path d="M8.5 12h7"/><path d="M6 8.5v7"/><path d="M18 8.5v7"/><path d="M3 10.5v3"/><path d="M21 10.5v3"/>',
  diet: '<path d="M4 12.5c0 4.4 3.6 8 8 8s8-3.6 8-8H4Z"/><path d="M9.5 9V7"/><path d="M14.5 9V7"/>',
  mine: '<circle cx="12" cy="7.5" r="3.5"/><path d="M5 20c.9-3.6 3.7-5.5 7-5.5s6.1 1.9 7 5.5"/>'
};
const tabs = [
  { key: 'today', label: '今日' },
  { key: 'training', label: '训练' },
  { key: 'diet', label: '饮食' },
  { key: 'mine', label: '我的' }
];

function render() {
  const view = document.getElementById('view');
  view.className = 'view';
  if (tab === 'today') view.innerHTML = viewToday();
  else if (tab === 'training') view.innerHTML = viewTraining();
  else if (tab === 'diet') view.innerHTML = viewDiet();
  else view.innerHTML = viewMine();

  document.getElementById('tabbar').innerHTML = tabs.map((t) =>
    '<button class="tab ' + (tab === t.key ? 'active' : '') + '" onclick="switchTab(\'' + t.key + '\')">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (tab === t.key ? 2 : 1.5) + '" stroke-linecap="round" stroke-linejoin="round">' + icons[t.key] + '</svg>' +
    '<span>' + t.label + '</span></button>').join('');
  window.scrollTo(0, 0);
}
render();
</script>
</body>
</html>
